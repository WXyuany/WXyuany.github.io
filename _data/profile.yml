  research_title: "Research Interests"
  research_intro: |
    My research interests center on **whole-body motion control for humanoid robots**, as well as **motion planning, simultaneous localization and mapping (SLAM), and perception for indoor and outdoor environments**. More recently, I have been exploring world-model-based robotic brain perception and control (WAM), with the goal of improving a robot's environmental understanding, decision-making, and autonomous execution of complex tasks.

    I have developed and deployed algorithms for humanoid robots with different body scales and mechanical architectures, including the **Unitree G1, Booster Robotics PM01, Westlake Robot O1, and Kepler K2**, as well as a confidential Russian humanoid platform. In addition, I have implemented motion-planning and perception strategies for indoor and outdoor locomotion over uneven terrain on the Unitree G1 and quadruped robot platforms.

    My previous work focused primarily on humanoid motion-control algorithms and full-body motion tracking. Using a motion-capture suit or a VR headset, I developed teleoperation systems that enable humanoid robots to track human motion in real time with low latency and high fidelity, forming an embodied-avatar system ([project description](https://www.wlrobo.com/module1)). Currently, I am particularly interested in integrating **vision-language models (VLMs) with low-level control**, enabling embodied-intelligence systems to perform complex tasks with greater autonomy and efficiency.
  research_areas:
    - "Whole-body motion control for humanoid robots"
    - "Motion planning and SLAM for indoor and outdoor environments"
    - "World-model-based robotic perception and control (WAM)"
    - "Integration of vision-language models with low-level control"
